# Builds every target and runs the whole ctest suite on Windows, macOS and Linux, then
# uploads the binaries as workflow artifacts.
#
# THE ARTIFACTS ARE PACKAGES. Only a manual run with the `release` input set turns them into a
# release, and then only a DRAFT (the release job, at the end). Each one is self-contained. Windows: windeployqt copies the Qt DLLs beside qinta.exe and the Stage step
# copies the VC++ runtime DLLs beside them, so the folder runs on Windows 10 or 11 with no
# redistributable (the UCRT ships with the OS). macOS: scripts/package-macos.sh builds Qinta.app
# with its Qt frameworks inside, signed ad hoc and not notarized. Linux: scripts/package-linux.sh
# builds an AppImage, which the job then runs in a container with no Qt installed.
#
# ripgrep is installed on every runner because readme_figures depends on it: without rg on
# PATH, scripts/check-readme-figures.sh checks sixteen claims instead of all of them and exits 0.
# The EXPECTED_CHECKS arm would catch that, but installing rg is cheaper than debugging it.
#
# Every action is pinned to a full commit SHA, with its release tag in a trailing comment. The
# repo's Actions settings require that (sha_pinning_required), so a tag reference fails the run
# before any job starts. A tag can be moved to new code, and these jobs build the shipped
# binaries. Dependabot (.github/dependabot.yml) bumps the SHA and the comment together.

name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Draft a GitHub Release with this version, e.g. v0.0.1 (empty: an ordinary run)'
        required: false
        default: ''

# A release run's packages carry the version in their names (scripts/package-*.sh read it).
# Empty on every other run, where they are named by commit.
env:
  QINTA_VERSION: ${{ inputs.release }}

# Superseded runs are cancelled on pull requests only. On master every commit keeps its run:
# the Windows build took over 15 minutes before the app closure was compiled once, and with
# cancel-in-progress on pushes, commits landing a few minutes apart cancelled it before it had
# once reached the test step.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    # /MP compiles a project's files in parallel; --parallel alone only runs projects in
    # parallel, and the small unit-test targets still compile their own copies of the files they
    # test (the app closure is compiled once, as CMakeLists.txt's qinta_app). Set through
    # the environment because CMake prepends CXXFLAGS to its defaults, where passing
    # -DCMAKE_CXX_FLAGS would replace them and drop /EHsc.
    env:
      CFLAGS: /MP
      CXXFLAGS: /MP
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The version the README's Windows section was measured with.
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Install ripgrep
        run: choco install ripgrep --no-progress -y

      - name: Configure
        run: cmake -S . -B build -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config Release --parallel

      # --repeat until-pass:2 because clipboard_tests round-trips the real system clipboard
      # and loses a race now and then. A second failure still fails the job.
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --repeat until-pass:2

      # App-local VC++ runtime, docs/port.md's C runtime option B. windeployqt's --compiler-runtime
      # does NOT do this for MSVC: measured 2026-10-07, it copies vc_redist.x64.exe, the
      # installer, and with no VCINSTALLDIR it copies nothing. So the runtime DLLs come from
      # the Visual Studio install's own Redist folder (Microsoft.VC*.CRT, the unit Microsoft
      # documents for app-local deployment) and windeployqt is told to leave the runtime alone.
      - name: Stage
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/Release/qinta.exe dist/
          windeployqt --release --no-translations --no-compiler-runtime dist/qinta.exe
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory | Sort-Object FullName | Select-Object -Last 1
          if (-not $crt) { throw "no Microsoft.VC*.CRT folder under $vs\VC\Redist\MSVC" }
          Copy-Item "$($crt.FullName)\*.dll" dist/
          foreach ($dll in 'vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll', 'msvcp140_1.dll', 'msvcp140_2.dll') {
            if (-not (Test-Path "dist/$dll")) { throw "dist/ is missing $dll" }
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qinta-windows-x64
          path: dist/

      # The shipped folder, copied so the settings.ini that puts qinta in portable mode never
      # lands in the artifact above. print-pages-agree compares these pages with MinGW's.
      - name: Print pages
        shell: bash
        run: |
          mkdir harness-bin
          cp -r dist/* harness-bin/
          echo '; print-pages harness' > harness-bin/settings.ini
          bash scripts/print-pages-manifest.sh harness-bin/qinta.exe print-pages

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: print-pages-msvc
          path: print-pages/
          retention-days: 14

  # MinGW-w64 on Windows: MSYS2's UCRT64 GCC and Qt 6, the route docs/port.md's "MinGW on Windows"
  # section names, because it is the one Windows build that needs no Visual Studio. Added
  # 2026-10-07 as continue-on-error, a finding rather than a broken master, until it had been
  # green. It went green on 2026-10-11 (53/53, run 38092855683), so since then a red here fails
  # the run like any other host. No binary artifact, because the MSVC job's folder is the one
  # that ships; its printed pages are uploaded for print-pages-agree.
  windows-mingw:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-ripgrep

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --repeat until-pass:2

      - name: Print pages
        run: |
          mkdir harness-bin
          cp build/qinta.exe harness-bin/
          echo '; print-pages harness' > harness-bin/settings.ini
          bash scripts/print-pages-manifest.sh harness-bin/qinta.exe print-pages

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: print-pages-mingw
          path: print-pages/
          retention-days: 14

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: brew install qtbase qtsvg ripgrep

      # Homebrew installs qtsvg as its own keg, outside qtbase's prefix, and Qt6Config looks
      # for add-on modules relative to its own install -- so a qtsvg keg on CMAKE_PREFIX_PATH
      # is never searched and Qt6Svg_FOUND comes back false. QT_ADDITIONAL_PACKAGES_PREFIX_PATH
      # is Qt's hook for modules installed in a separate prefix.
      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qtbase)" \
            -DQT_ADDITIONAL_PACKAGES_PREFIX_PATH="$(brew --prefix qtsvg)"

      - name: Build
        run: cmake --build build --parallel "$(sysctl -n hw.ncpu)"

      - name: Test
        run: ctest --test-dir build --output-on-failure --repeat until-pass:2

      - name: Package
        run: bash scripts/package-macos.sh build package

      # From the zip a user would download, not from the folder that was zipped: ditto keeps the
      # frameworks' symlinks, and an unzip that lost them would show here as a broken bundle.
      - name: The packaged app runs
        run: |
          mkdir unzipped
          ditto -x -k package/qinta-*-macos-*.zip unzipped
          codesign --verify --deep --strict unzipped/Qinta.app
          QT_QPA_PLATFORM=offscreen unzipped/Qinta.app/Contents/MacOS/qinta \
            --printpages pages tests/fixtures/markdown-regression-control.md
          test "$(ls pages/*.png | wc -l | tr -d ' ')" = 2

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qinta-macos-app
          path: package/qinta-*-macos-*.zip

  linux:
    # Pinned rather than -latest: 24.04 ships Qt 6.4.2, the version the Linux build was
    # measured against, and a runner-image bump would change Qt minor underneath the suite.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ cmake qt6-base-dev qt6-base-dev-tools qt6-svg-dev libgl-dev fonts-dejavu-core \
              ripgrep python3-pil

      - name: Configure
        # Warnings as errors on this job only (CMakeLists.txt, QINTA_WARNINGS_AS_ERRORS).
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DQINTA_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure --repeat until-pass:2

      - name: Package
        run: bash scripts/package-linux.sh build package

      # The AppImage in a bare Ubuntu with no Qt at all, so a library it failed to bundle cannot
      # be found on the runner instead. The packages installed are what the AppImage expects from
      # the desktop it runs on, DERIVED rather than guessed: every ELF file in the AppDir (99)
      # through ldd, keeping what resolves outside it, gives 23 libraries -- GL/GLX/EGL,
      # fontconfig, freetype, harfbuzz, X11/xcb, ICE/SM, and base-image ones like libc. linuxdeploy
      # leaves these to the host on purpose. The run fails if any Qt library is present first.
      - name: The AppImage runs without Qt installed
        run: |
          docker run --rm -v "$PWD:/w" -w /w ubuntu:24.04 bash -c '
            set -e
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends libegl1 libglx0 libopengl0 \
              libfontconfig1 libfreetype6 libharfbuzz0b libx11-6 libx11-xcb1 libxcb1 \
              libsm6 libice6 fonts-dejavu-core >/dev/null
            if ls /usr/lib/x86_64-linux-gnu/libQt6* >/dev/null 2>&1; then
              echo "Qt is installed in the container, so this run proves nothing"; exit 1
            fi
            APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen ./package/qinta-*.AppImage \
              --printpages /tmp/pages tests/fixtures/markdown-regression-control.md
            test "$(ls /tmp/pages/*.png | wc -l)" = 2'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qinta-linux-appimage
          path: package/qinta-*.AppImage

  # docs/port.md's MinGW gate: the two Windows builds must paginate the rendering fixtures alike. A
  # different page count or page size fails the run; pixel differences are reported in the job
  # summary and do not fail it, because the two jobs install different Qt releases and glyph
  # rasterisation moves between releases.
  print-pages-agree:
    needs: [windows, windows-mingw]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: print-pages-msvc
          path: msvc

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: print-pages-mingw
          path: mingw

      - name: Install Pillow
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-pil

      - name: Compare
        run: python3 scripts/compare_print_pages.py msvc mingw

  # A DRAFT GitHub Release, on a manual run of this workflow with the `release` input set (for
  # example v0.0.1). Only after every job above has passed, the MinGW build and the page
  # comparison included. The draft points at this run's commit and is visible only to the
  # repository's owner; GitHub creates the tag when the draft is PUBLISHED, so nothing public
  # happens until a person presses Publish. Uses the gh CLI the runner already has, not a
  # third-party release action, so the repository's action allowlist is unchanged.
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release != ''
    needs: [windows, windows-mingw, macos, linux, print-pages-agree]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.release }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Refuses rather than overwrites: a version that is not vX.Y.Z, one that is not the version
      # CMakeLists.txt builds (the exe, the start page and the macOS bundle all report that one),
      # and one that already has a release or a tag.
      - name: Check the version
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "release must look like v1.2.3, got '$VERSION'"; exit 1; }
          built=$(sed -n 's/^project([a-z]* VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          [ "v$built" = "$VERSION" ] || { echo "release $VERSION is not the version CMakeLists.txt builds ($built)"; exit 1; }
          if gh release view "$VERSION" >/dev/null 2>&1; then echo "a release $VERSION already exists"; exit 1; fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then echo "a tag $VERSION already exists"; exit 1; fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qinta-windows-x64
          path: qinta-${{ inputs.release }}-windows-x64

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qinta-macos-app
          path: macos

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qinta-linux-appimage
          path: linux

      # The Windows folder is zipped with its own top-level folder, so unzipping it does not
      # spill 50 files into Downloads. The notes are this version's section of CHANGELOG.md.
      - name: Assemble
        run: |
          mkdir release
          zip -qr "release/qinta-$VERSION-windows-x64.zip" "qinta-$VERSION-windows-x64"
          cp "macos/qinta-$VERSION-macos-arm64.zip" "linux/qinta-$VERSION-x86_64.AppImage" release/
          awk -v h="## [$VERSION]" 'index($0, h) == 1 { f = 1; next } f && /^## / { exit } f' \
            CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no '## [$VERSION]' section"; exit 1; }
          printf '\n### Downloads\n\n%s\n%s\n%s\n' \
            "- Windows 10 or 11: unzip qinta-$VERSION-windows-x64.zip and run qinta.exe. Nothing to install." \
            "- macOS (Apple silicon): unzip and move Qinta.app to Applications. It is not notarized, so macOS blocks the first open; run \`xattr -dr com.apple.quarantine /Applications/Qinta.app\` once in Terminal, or use System Settings > Privacy & Security > Open Anyway. Right-click > Open no longer works since macOS 15." \
            "- Linux (x86_64): make the AppImage executable (chmod +x) and run it." >> notes.md
          ls -la release
          cat notes.md

      - name: Draft the release
        run: |
          gh release create "$VERSION" --draft --target "$GITHUB_SHA" \
            --title "Qinta $VERSION" --notes-file notes.md release/*
