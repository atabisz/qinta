# Builds every target and runs the whole ctest suite on Windows, macOS and Linux, then
# uploads the binaries as workflow artifacts.
#
# THE ARTIFACTS ARE NOT RELEASES. Only the Windows one is self-contained: windeployqt copies
# the Qt DLLs beside qinta.exe, and the Stage step copies the VC++ runtime DLLs beside them, so
# the folder runs on a Windows 10 or 11 install with no redistributable (the UCRT ships with the
# OS). The macOS and Linux binaries link against the Qt the runner
# installed, so they run only where the same Qt is installed -- packaging them as an .app
# bundle and an AppImage is the release job's work, not this one's.
#
# ripgrep is installed on every runner because readme_figures depends on it: without rg on
# PATH, scripts/check-readme-figures.sh checks sixteen claims instead of all of them and exits 0.
# The EXPECTED_CHECKS arm would catch that, but installing rg is cheaper than debugging it.

name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Superseded runs are cancelled on pull requests only. On master every commit keeps its run:
# the Windows build took over 15 minutes before the app closure was compiled once, and with
# cancel-in-progress on pushes, commits landing a few minutes apart cancelled it before it had
# once reached the test step.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    # /MP compiles a project's files in parallel; --parallel alone only runs projects in
    # parallel, and the small unit-test targets still compile their own copies of the files they
    # test (the app closure is compiled once, as CMakeLists.txt's qinta_app). Set through
    # the environment because CMake prepends CXXFLAGS to its defaults, where passing
    # -DCMAKE_CXX_FLAGS would replace them and drop /EHsc.
    env:
      CFLAGS: /MP
      CXXFLAGS: /MP
    steps:
      - uses: actions/checkout@v4

      # The version the README's Windows section was measured with.
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Install ripgrep
        run: choco install ripgrep --no-progress -y

      - name: Configure
        run: cmake -S . -B build -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config Release --parallel

      # --repeat until-pass:2 because clipboard_tests round-trips the real system clipboard
      # and loses a race now and then. A second failure still fails the job.
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --repeat until-pass:2

      # App-local VC++ runtime, docs/port.md's C runtime option B. windeployqt's --compiler-runtime
      # does NOT do this for MSVC: measured 2026-10-07, it copies vc_redist.x64.exe, the
      # installer, and with no VCINSTALLDIR it copies nothing. So the runtime DLLs come from
      # the Visual Studio install's own Redist folder (Microsoft.VC*.CRT, the unit Microsoft
      # documents for app-local deployment) and windeployqt is told to leave the runtime alone.
      - name: Stage
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/Release/qinta.exe dist/
          windeployqt --release --no-translations --no-compiler-runtime dist/qinta.exe
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory | Sort-Object FullName | Select-Object -Last 1
          if (-not $crt) { throw "no Microsoft.VC*.CRT folder under $vs\VC\Redist\MSVC" }
          Copy-Item "$($crt.FullName)\*.dll" dist/
          foreach ($dll in 'vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll', 'msvcp140_1.dll', 'msvcp140_2.dll') {
            if (-not (Test-Path "dist/$dll")) { throw "dist/ is missing $dll" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: qinta-windows-x64
          path: dist/

      # The shipped folder, copied so the settings.ini that puts qinta in portable mode never
      # lands in the artifact above. print-pages-agree compares these pages with MinGW's.
      - name: Print pages
        shell: bash
        run: |
          mkdir harness-bin
          cp -r dist/* harness-bin/
          echo '; print-pages harness' > harness-bin/settings.ini
          bash scripts/print-pages-manifest.sh harness-bin/qinta.exe print-pages

      - uses: actions/upload-artifact@v4
        with:
          name: print-pages-msvc
          path: print-pages/
          retention-days: 14

  # MinGW-w64 on Windows: MSYS2's UCRT64 GCC and Qt 6, the route docs/port.md's "MinGW on Windows"
  # section names, because it is the one Windows build that needs no Visual Studio. Added
  # 2026-10-07 as continue-on-error, a finding rather than a broken master, until it had been
  # green. It went green on 2026-10-11 (53/53, run 38092855683), so since then a red here fails
  # the run like any other host. No binary artifact, because the MSVC job's folder is the one
  # that ships; its printed pages are uploaded for print-pages-agree.
  windows-mingw:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-ripgrep

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --repeat until-pass:2

      - name: Print pages
        run: |
          mkdir harness-bin
          cp build/qinta.exe harness-bin/
          echo '; print-pages harness' > harness-bin/settings.ini
          bash scripts/print-pages-manifest.sh harness-bin/qinta.exe print-pages

      - uses: actions/upload-artifact@v4
        with:
          name: print-pages-mingw
          path: print-pages/
          retention-days: 14

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install qtbase qtsvg ripgrep

      # Homebrew installs qtsvg as its own keg, outside qtbase's prefix, and Qt6Config looks
      # for add-on modules relative to its own install -- so a qtsvg keg on CMAKE_PREFIX_PATH
      # is never searched and Qt6Svg_FOUND comes back false. QT_ADDITIONAL_PACKAGES_PREFIX_PATH
      # is Qt's hook for modules installed in a separate prefix.
      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qtbase)" \
            -DQT_ADDITIONAL_PACKAGES_PREFIX_PATH="$(brew --prefix qtsvg)"

      - name: Build
        run: cmake --build build --parallel "$(sysctl -n hw.ncpu)"

      - name: Test
        run: ctest --test-dir build --output-on-failure --repeat until-pass:2

      - uses: actions/upload-artifact@v4
        with:
          name: qinta-macos-arm64
          path: build/qinta

  linux:
    # Pinned rather than -latest: 24.04 ships Qt 6.4.2, the version the Linux build was
    # measured against, and a runner-image bump would change Qt minor underneath the suite.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ cmake qt6-base-dev qt6-svg-dev libgl-dev fonts-dejavu-core ripgrep

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure --repeat until-pass:2

      - uses: actions/upload-artifact@v4
        with:
          name: qinta-linux-x64
          path: build/qinta

  # docs/port.md's MinGW gate: the two Windows builds must paginate the rendering fixtures alike. A
  # different page count or page size fails the run; pixel differences are reported in the job
  # summary and do not fail it, because the two jobs install different Qt releases and glyph
  # rasterisation moves between releases.
  print-pages-agree:
    needs: [windows, windows-mingw]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: print-pages-msvc
          path: msvc

      - uses: actions/download-artifact@v4
        with:
          name: print-pages-mingw
          path: mingw

      - name: Install Pillow
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-pil

      - name: Compare
        run: python3 scripts/compare_print_pages.py msvc mingw
