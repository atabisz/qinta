name: Text stack spike

# Throwaway job for the spike branch. Answers whether a portable text stack can do
# what tinta uses DirectWrite for; deliberately NOT wired to master.
#
# Runs on Linux and macOS because the two have different font situations and the
# fallback probe is the one most likely to differ between them.

on:
  push:
    branches:
      - 'spike/**'
  workflow_dispatch:

jobs:
  probe:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      # fonts-noto-cjk and fonts-noto-core are what make the fallback probe
      # meaningful — without them the runner has no CJK or Arabic coverage and P3
      # would fail for a reason that says nothing about the port.
      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libicu-dev libharfbuzz-dev libfreetype6-dev libfontconfig1-dev \
            fonts-dejavu-core fonts-noto-cjk fonts-noto-core pkg-config

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install icu4c harfbuzz freetype fontconfig pkg-config

      - name: Show what we linked against
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            export PKG_CONFIG_PATH="$(brew --prefix icu4c)/lib/pkgconfig:$PKG_CONFIG_PATH"
          fi
          for p in icu-uc icu-i18n harfbuzz freetype2 fontconfig; do
            printf '%-12s %s\n' "$p" "$(pkg-config --modversion $p 2>&1)"
          done

      - name: Build probe
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            export PKG_CONFIG_PATH="$(brew --prefix icu4c)/lib/pkgconfig:$PKG_CONFIG_PATH"
          fi
          set -x
          c++ -std=c++17 -O1 -Wall spike/text_probe.cpp -o text_probe \
            $(pkg-config --cflags --libs icu-uc icu-i18n harfbuzz freetype2 fontconfig)

      # The probe's own exit code is the verdict: nonzero if any check failed.
      # No `|| true` here — a spike that cannot fail is not a measurement.
      - name: Run probe
        run: ./text_probe
